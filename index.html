<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לומדת איכות 2026</title>
<style>
:root{--ink:#1d2a33;--muted:#66747e;--line:#dde4ea;--bg:#eef3f6;--card:#fff;--blue:#95D9EE;--blue-d:#1f7ea3;--orange:#F1972D;--green:#BBDA88;--green-d:#3f8a3a;--red:#d9534f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Assistant","Rubik","Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;line-height:1.6}
button{font:inherit;cursor:pointer}
/* top bar */
.top{background:#1d2a33;color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.menu-btn{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;width:40px;height:36px;font-size:20px;line-height:1}
.menu-btn:hover{background:#ffffff1a}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
.tab{background:transparent;border:0;color:#cfe3ec;padding:6px 12px;border-radius:999px;font-size:15px}
.tab:hover{background:#ffffff1a;color:#fff}
.tab.on{background:var(--blue);color:#12303d;font-weight:700}
.tab.done::after{content:" ✓";color:var(--green)}
.tab.on.done::after{color:var(--green-d)}
.bar{height:4px;background:#ffffff22}
.bar>i{display:block;height:100%;background:var(--orange);transition:width .3s}
/* drawer */
.scrim{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(360px,90vw);background:#fff;z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-4px 0 20px #0002}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.drawer header button{border:0;background:none;font-size:22px}
.toc{overflow:auto;padding:8px 0}
.toc details{border-bottom:1px solid var(--line)}
.toc summary{padding:10px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.toc summary::after{content:"▾";color:var(--muted)}
.toc details[open] summary::after{content:"▴"}
.toc a{display:flex;gap:8px;padding:6px 16px 6px 12px;padding-inline-start:28px;color:var(--ink);text-decoration:none;font-size:14px}
.toc a:hover{background:#f2f8fb}
.toc a.on{background:#e3f4fa;font-weight:700}
.toc a .v{margin-inline-start:auto;color:var(--green-d)}
/* stage */
main{flex:1;overflow:auto;padding:22px 16px}
.slide{max-width:1100px;margin:0 auto;background:var(--card);border-radius:14px;box-shadow:0 2px 14px #0000000f;padding:28px 34px;min-height:100%;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
h2.title{margin:0 0 16px;font-size:26px;line-height:1.3}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.cols.noimg{grid-template-columns:1fr}
.txt p{margin:0 0 6px}
.txt{margin-bottom:14px}
.pics img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.chip{border:2px solid var(--blue);background:#eaf7fc;color:#12303d;border-radius:12px;padding:10px 18px;font-size:16px;min-width:120px;transition:.15s}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 10px #0000001a}
.chip.cur{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.chip.done{background:var(--green);border-color:var(--green)}
.chip.done::before{content:"✓ ";font-weight:700}
.chip.here{outline:3px solid var(--blue-d);outline-offset:2px}
.chip.cta{background:#F68428;border-color:#F68428;color:#fff;font-weight:700;font-size:18px}
.chips.big .chip{min-width:200px;padding:18px 24px;font-size:18px}
.sub{font-size:14px;color:var(--muted);margin:6px 0 0}
/* video */
.video{background:#12303d;color:#fff;border-radius:12px;aspect-ratio:16/6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;margin-bottom:14px;border:0;width:100%}
.video .play{width:64px;height:64px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:26px}
.video:hover .play{transform:scale(1.06)}
.script{overflow-x:auto}
.script table{border-collapse:collapse;width:100%;font-size:14px}
.script th,.script td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:right}
.script th{background:#f0f5f8}
.script p{margin:0 0 2px}
/* info */
.info-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.ibtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--blue-d);background:#fff;color:var(--blue-d);font-weight:700;font-style:italic;font-size:18px}
.ibtn.on{background:var(--blue-d);color:#fff}
.info{background:#f2f9fc;border-inline-start:4px solid var(--blue-d);padding:10px 14px;border-radius:8px;margin:8px 0}
.info p{margin:0}
/* checklist */
.check h4{margin:12px 0 4px}
.check label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.check input{margin-top:6px;width:18px;height:18px;accent-color:var(--green-d)}
.reveal{background:#eef8e6;border:2px solid var(--green);border-radius:10px;padding:12px 16px;margin-top:12px}
.reveal p{margin:0 0 4px}
.btn{border:0;border-radius:10px;padding:10px 22px;background:var(--blue-d);color:#fff;font-size:16px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--blue-d);border:2px solid var(--blue-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* quiz */
.q-hint{color:var(--muted);margin:-8px 0 14px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{text-align:right;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:16px;display:flex;gap:10px;align-items:center}
.opt:hover{border-color:var(--blue)}
.opt .box{width:22px;height:22px;flex:0 0 22px;border:2px solid #9aaab4;border-radius:50%}
.multi .opt .box{border-radius:5px}
.opt.sel{border-color:var(--blue-d);background:#eef8fc}
.opt.sel .box{background:var(--blue-d);border-color:var(--blue-d);box-shadow:inset 0 0 0 3px #fff}
.opt.right{border-color:var(--green-d);background:#eef8e6}
.opt.wrong{border-color:var(--red);background:#fdeeee}
.opt.missed{border-style:dashed;border-color:var(--green-d)}
.match-row{display:flex;gap:12px;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;flex-wrap:wrap}
.match-row select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #b9c6ce;min-width:180px}
.match-row.right{border-color:var(--green-d);background:#eef8e6}
.match-row.wrong{border-color:var(--red);background:#fdeeee}
.order .opt .num{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#e8eef2;display:flex;align-items:center;justify-content:center;font-weight:700}
.order .opt.sel .num{background:var(--blue-d);color:#fff}
.fb{border-radius:12px;padding:12px 16px;margin-top:14px}
.fb.ok{background:#eef8e6;border:2px solid var(--green)}
.fb.bad{background:#fdeeee;border:2px solid #f0b4b2}
.fb b{display:block;margin-bottom:4px}
.qactions{display:flex;gap:10px;flex-wrap:wrap}
/* hero */
.hero{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#e7f6fb,#fff3e6)}
.hero h1{font-size:40px;margin:0 0 8px}
.hero .lead{font-size:20px;color:var(--muted);margin-bottom:20px}
/* bottom nav */
.nav{background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 16px}
.arrow{border:0;background:var(--blue-d);color:#fff;border-radius:10px;padding:10px 20px;font-size:16px;font-weight:700;min-width:120px}
.arrow.prev{background:#fff;color:var(--blue-d);border:2px solid var(--blue-d)}
.arrow:disabled{opacity:.35;cursor:not-allowed}
.count{flex:1;text-align:center;color:var(--muted);font-size:14px}
/* hotspots */
.hot-prog{color:var(--muted);margin:0 0 10px}
.hot-prog b{color:var(--green-d)}
.hotfig{position:relative;max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:12px;overflow:visible}
.hotfig img{display:block;width:100%;height:auto;border-radius:12px}
.hot{position:absolute;transform:translate(50%,-50%);width:18px;height:18px;border-radius:50%;border:2px solid #fff;background:var(--orange);color:#fff;font-size:10px;font-weight:700;line-height:1;box-shadow:0 2px 8px #0005;display:flex;align-items:center;justify-content:center;padding:0;animation:pulse 1.8s infinite}
[dir=rtl] .hot{transform:translate(-50%,-50%)}
.hot.seen{background:var(--green-d);animation:none}
.hot:hover,.hot:focus-visible{transform:translate(-50%,-50%) scale(1.3);outline:none}
.hot .tip{position:absolute;bottom:calc(100% + 8px);white-space:nowrap;background:#1d2a33;color:#fff;font-style:normal;font-size:13px;font-weight:600;padding:3px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:.15s}
.hot:hover .tip,.hot:focus-visible .tip{opacity:1}
@keyframes pulse{0%{box-shadow:0 0 0 0 #F1972Dcc}70%{box-shadow:0 0 0 9px #F1972D00}100%{box-shadow:0 0 0 0 #F1972D00}}
.hot::after{content:'';position:absolute;inset:-10px;border-radius:50%}
.pop{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:25;padding:16px}
.pop.show{display:flex}
.pbox{background:#fff;border-radius:16px;max-width:560px;width:100%;box-shadow:0 10px 40px #0004;animation:fade .2s;border-top:6px solid var(--orange)}
.pbox header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 6px}
.pbox h3{margin:0;font-size:22px}
.pclose{border:0;background:none;font-size:26px;line-height:1;color:var(--muted)}
.pbody{padding:4px 20px 6px;max-height:60vh;overflow:auto}
.pbody p{margin:0 0 8px}
.pbox{max-width:680px}
.acc{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fafcfd}
.acc summary{cursor:pointer;padding:9px 14px;font-weight:700;color:var(--blue-d)}
.acc[open] summary{border-bottom:1px solid var(--line)}
.acc>*:not(summary){padding:0 14px}
.acc p:first-of-type{margin-top:8px}
.pfoot{padding:10px 20px 18px;text-align:left}
/* end overlay */
.end{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:30}
.end.show{display:flex}
.end .box{background:#fff;border-radius:16px;padding:34px 40px;text-align:center;max-width:460px}
.end h3{font-size:28px;margin:0 0 8px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.slide{padding:20px}.brand{display:none}h2.title{font-size:21px}.arrow{min-width:0}}
</style>
</head>
<body>
<div class="top">
  <button class="menu-btn" id="menuBtn" aria-label="תפריט ניווט">☰</button>
  <div class="brand">לומדת איכות 2026</div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" aria-label="תפריט ניווט">
  <header>תפריט הלומדה <button id="closeBtn" aria-label="סגירה">×</button></header>
  <div class="toc" id="toc"></div>
</aside>
<main id="main"></main>
<div class="nav">
  <button class="arrow prev" id="prev">→ הקודם</button>
  <div class="count" id="count"></div>
  <button class="arrow next" id="next">הבא ←</button>
</div>
<div class="pop" id="pop" role="dialog" aria-modal="true"><div class="pbox"><header><h3></h3><button class="pclose" aria-label="סגירה">×</button></header><div class="pbody"></div><div class="pfoot"><button class="btn pok">הבנתי</button></div></div></div>
<div class="end" id="end"><div class="box">
  <h3>כל הכבוד! 🎉</h3>
  <p>סיימתם את לומדת האיכות.</p>
  <p id="score"></p>
  <div class="qactions" style="justify-content:center;margin-top:16px">
    <button class="btn" id="restart">חזרה להתחלה</button>
    <button class="btn ghost" id="closeEnd">סגירה</button>
  </div>
</div></div>
<script>
const DATA={"slides": [{"n": 1, "ch": 0, "blocks": [{"t": "text", "h": "<p><b>ברוכים הבאים ללומדת איכות<\/b><br>המשמרת מתחילה<\/p>"}], "imgs": [], "chips": [{"l": "בואו ניכנס...", "to": 2, "st": ""}], "title": "פתיחה"}, {"n": 2, "ch": 0, "blocks": [{"t": "text", "h": "<p><b>ברוכים הבאים ללומדה<\/b><\/p><p>לפני שמתחילים, כמה דברים שחשוב להכיר:<\/p><p>- בתחתית המסך ישנם חצי ניווט כדי להתקדם בין המסכים או לחזור אחורה.<\/p><p>- במהלך הלומדה יופיעו שאלות ותרגולים לבדיקת ההבנה.<\/p><p>- ניתן להשתמש בסרגל הניווט כדי לעקוב אחר ההתקדמות בלומדה.<\/p><p>- בחלק מהמסכים תוכלו ללחוץ על אייקונים, אזורים או כפתורים לקבלת מידע נוסף.<\/p><p>- נדרש לעבור על כל התוכן והאינטראקציות כדי להשלים את הלומדה בהצלחה.<\/p>"}], "imgs": [], "title": "ברוכים הבאים ללומדה"}, {"n": 3, "ch": 0, "blocks": [{"t": "text", "h": "<p>היי, אני רפי.<\/p><p>מומחה מספר אחת לשמירה על איכות ובטיחות המזון פה בארגון<\/p><p>אני מלווה אתכם היום לאורך המשמרת, ונעבור יחד על כל מה שחשוב כדי לשמור על איכות ובטיחות המזון.<\/p><p><b>במהלך המשמרת נלמד:<\/b><br>1. מהם תנאי הייצור הנאותים<\/p><p>2. מהם גורמי הסיכון והסכנות בבטיחות מזון<\/p><p>3. מה היא איכות<\/p><p>4. איך אני כעובד משתלב בתוך מערך הייצור<\/p><p>אז אם אתם מוכנים...<\/p><p><b>בואו נתחיל את המשמרת.<\/b><\/p>"}], "imgs": [], "title": "היי, אני רפי."}, {"n": 4, "ch": 0, "blocks": [{"t": "text", "h": "<p><b>סרטון – <\/b>(1:00) <b>הגולד סטנדרט<\/b><br>רפי מלווה ומדבר את הסרטון<\/p>"}, {"t": "table", "h": "<table><tr><th><p><b>מה שומעים<\/b><\/p><\/th><th><p><b>מה רואים<\/b><\/p><\/th><th><p><b>כותרות<\/b><\/p><\/th><\/tr><tr><td><p>סאונד של מפעל<\/p><\/td><td><p>מבט מרחוק של מפעל הארגון<\/p><\/td><td><\/td><\/tr><tr><td><p>היי,  זה שוב אני<\/p><\/td><td><p>זום אין לכניסה למפעל, רפי נכנס<\/p><\/td><td><p>תחילת משמרת<\/p><\/td><\/tr><tr><td><p>הרבה מכם שואלים אותי: &quot;רפי יא&#x27;מלך מה ההבדל בין איכות לבטיחות מזון?<\/p><\/td><td><p>רפי מדבר<\/p><\/td><td><p>מה ההבדל בין איכות לבטיחות מזון.<\/p><\/td><\/tr><tr><td><p>איכות במזון עוסקת בחווית הצרכן<\/p><p>אנחנו נדרשים לעמוד במדדי האיכות שהוגדרו, לדוגמא תאריך תפוגה תקין<\/p><\/td><td><p>רפי מראה תאריך תפוגה במעדן<\/p><\/td><td><p>איכות במזון<\/p><\/td><\/tr><tr><td><p>בטיחות המזון עוסקת בהגנה על בריאות הצרכן, אנחנו מוודאים שהמוצר בטוח לאכילה ולא יגרום נזק.<\/p><\/td><td><p>רפי מראה חתיכה של סיכה בתוך המעדן<\/p><\/td><td><p>בטיחות המזון<\/p><\/td><\/tr><tr><td><p>זה לא בטוח!<\/p><\/td><td><p>רפי מציג את הסיכה<\/p><\/td><td><p>לא בטוח!<\/p><\/td><\/tr><tr><td><p>אצלנו  בארגון, הכל מתחיל ונגמר בתרבות לאיכות<\/p><\/td><td><p>רפי מציג את סביבת העבודה בקו הייצור שכולם עובדים ולבושים בחלוק, כובע, בלי תכשיטים, נעלי עבודה (אצרף תמונה לדוגמא)<\/p><\/td><td><p>תרבות לאיכות<\/p><\/td><\/tr><tr><td><p>זה ב-DNA שלנו<\/p><\/td><td><p>סליל DNA מסתובב בין העובדים<\/p><\/td><td><p>של הארגון DNAה-<\/p><\/td><\/tr><tr><td><p>התרבות שלנו מתבססת על 4 עקרונות<\/p><\/td><td><p>רפי מציג את המספר 4 עם האצבעות<\/p><\/td><td><p>4 עקרונות<\/p><\/td><\/tr><tr><td><p>עבודה לפי נהלים, לשמירה  על איכות ובטיחות המוצרים<\/p><\/td><td><p>רפי מרים ומסתכל על מסמך תקנים<\/p><\/td><td><p>עבודה לפי נהלים<\/p><\/td><\/tr><tr><td><p>דיווח על כל פעולה וחריגה המשפיעים על המוצר ועל הצרכן<\/p><\/td><td><p>רפי מסתכל לצופה מבוהל ומתקשר למנהל לדווח<\/p><\/td><td><p>אחריות אישית<\/p><\/td><\/tr><tr><td><p>שאיפה להשתפר, לדייק ולפעול נכון, בכל יום מחדש.<\/p><\/td><td><p>רפי מתפס עד צמרת העץ ועומד כמנצח<\/p><\/td><td><p>מצוינות ושיפור מתמיד<\/p><\/td><\/tr><tr><td><p>ושמירה על בקרה ואבטחת איכות<\/p><\/td><td><p>רפי מציץ מהעץ עם משקפת לתוך המפעל<\/p><\/td><td><p>בקרה ואבטחת איכות.<\/p><\/td><\/tr><tr><td><p>תרבות לאיכות בארגון היא האחריות של כולנו, והיא מלווה אותנו בכל פעולה ובכל החלטה.<\/p><\/td><td><p>עובדים במפעל (לבושים לפי דוגמא שתשלח)<\/p><\/td><td><p>תרבות לאיכות בארגון<\/p><\/td><\/tr><tr><td><p>כי בסופו של דבר, איכות ובטיחות המזון הן לא רק דרישות או נהלים – הן ה-DNA שלנו<\/p><\/td><td><p>סליל DNA מסתובב בין העובדים<\/p><\/td><td><\/td><\/tr><\/table>"}], "imgs": [], "video": true, "title": "סרטון – (1:00) הגולד סטנדרט"}, {"n": 5, "ch": 0, "blocks": [{"t": "text", "h": "<p><b>אנחנו עומדים להתחיל את המשמרת <\/b><\/p><p>במהלך הלומדה ניכנס לעולם הייצור מנקודת מבט חדשה, כזו שמסתכלת לא רק על העבודה עצמה,<\/p><p>אלא גם על האחריות, תשומת הלב והפעולות הקטנות שעושות את ההבדל בין עבודה שגרתית לבין אירוע בטיחות מזון<\/p><p>לחצו על הכותרות להרחבה<\/p>"}], "imgs": [], "chips": [{"l": "עקרונות GMP", "to": 6, "st": "cur"}, {"l": "גורמי סיכון", "to": 32, "st": ""}, {"l": "תפקידים", "to": 45, "st": ""}], "title": "מפת הלומדה"}, {"n": 6, "ch": 1, "blocks": [{"t": "text", "h": "<p><b>סרטון – <\/b>(1:00) <b>עקרונות ה-<\/b><b>GMP<\/b><br>קואלה מלווה ומדבר את הסרטון<\/p>"}, {"t": "table", "h": "<table><tr><th><p><b>מה רואים<\/b><\/p><\/th><th><p><b>מה שומעים<\/b><\/p><\/th><th><p><b>כותרות<\/b><\/p><\/th><\/tr><tr><td><p>רפי עומד במבואה הסניטרית.<\/p><\/td><td><p>בטח כבר שמעתם את המושג GMP. אבל מה זה בעצם אומר?<\/p><\/td><td><p>מה זה בעצם GMP?<\/p><\/td><\/tr><tr><td><p>קואלה מציג את הפירוש<\/p><\/td><td><p>Good Manufacturing Practice<\/p><\/td><td><p>Good Manufacturing Practice<\/p><\/td><\/tr><tr><td><p>קואלה מתקדם במבואה<\/p><\/td><td><p>GMP, או תנאי ייצור נאותים, הם התנאים הבסיסיים הנדרשים לייצור מזון בטוח ואיכותי, והם מלווים אותנו בכל שלב בתהליך.<\/p><\/td><td><p>תנאי ייצור נאותים<\/p><\/td><\/tr><tr><td><p>קואלה עוצר ומדבר<\/p><\/td><td><p>בפשטות, GMP הוא הדרך שבה אנחנו עובדים בכל יום, בצורה עקבית ואחידה,<\/p><\/td><td><p>עבודה עקבית ואחידה<\/p><\/td><\/tr><tr><td><p>רפי מתקרב לעובד שמתלבש<\/p><\/td><td><p>כדי להפחית סיכונים ולשמור על איכות המוצרים.<\/p><\/td><td><p>שמירה על איכות המוצר<\/p><\/td><\/tr><tr><td><p>עובד לובש כיסוי ראש, שם את החלוק  ושוטף ידיים. ובודק שאין לו תכשיטים או שעון<\/p><\/td><td><p>זה מתחיל בהיגיינה אישית,<\/p><\/td><td><p>היגיינה אישית<\/p><\/td><\/tr><tr><td><\/td><td><p>בהקפדה על כללי הלבוש<\/p><\/td><td><p>כללי לבוש<\/p><\/td><\/tr><tr><td><\/td><td><p>ובהתנהגות נכונה באזורי הייצור.<\/p><\/td><td><p>התנהגות נכונה באזורי הייצור<\/p><\/td><\/tr><tr><td><p>רפי לובש גם כיסוי ראש<\/p><\/td><td><p>כן, גם אני לא נכנס לייצור בלי כיסוי ראש. הפרווה שלי לא מקבלת הנחות.<\/p><\/td><td><\/td><\/tr><tr><td><p>קואלה מנקה משטחים<\/p><\/td><td><p>אנחנו ממשיכים בניקיון ובסניטציה,<\/p><\/td><td><p>ניקיון וסניטציה<\/p><\/td><\/tr><tr><td><\/td><td><p>כדי לשמור על סביבת העבודה, הציוד והתשתיות נקיים.<\/p><\/td><td><\/td><\/tr><tr><td><p>יונה שעפה לכיוון החלון<\/p><\/td><td><p>ושומרים על המבנה והסביבה<\/p><\/td><td><p>שמירה על המבנה והסביבה<\/p><\/td><\/tr><tr><td><p>קואלה סוגר את החלון שהיונה לא תיכנס<\/p><\/td><td><p>כדי למנוע כניסה של מזהמים, מזיקים וגופים זרים למוצר<\/p><\/td><td><p>מפני מזהמים וגופים זרים<\/p><\/td><\/tr><tr><td><p>קואלה מתקרב לעובד שבודק מכונה, מבצע תחזוקה ומסמן שבוצעה בדיקה.<\/p><\/td><td><p>אנחנו דואגים לציוד ולתחזוקה תקינים,<\/p><\/td><td><p>ציוד ותחזוקה<\/p><\/td><\/tr><tr><td><p>קואלה פונה לעובד<\/p><\/td><td><p>תקין?<\/p><\/td><td><\/td><\/tr><tr><td><p>קואלה מדבר<\/p><\/td><td><p>ואם משהו אינו תקין, כמובן שמדווחים.<\/p><\/td><td><p>אחריות שלכם לדווח<\/p><\/td><\/tr><tr><td><p>זום האוט על הקו ייצור<\/p><\/td><td><p>GMP הוא הרבה יותר מסדרת נהלים.<\/p><\/td><td><\/td><\/tr><tr><td><p>רואים את כל העובדים מרוצים ועובדים בצורה תקינה<\/p><\/td><td><p>GMP הם חלק מה-DNA שלנו,<\/p><\/td><td><p>GMP הם חלק מה-DNA שלנו,<\/p><\/td><\/tr><tr><td><p>זום אין על קואלה מדבר<\/p><\/td><td><p>ומהווים בסיס לתרבות לאיכות שעל פיה אנחנו עובדים בכל יום.<\/p><\/td><td><p>תרבות האיכות בארגון<\/p><\/td><\/tr><tr><td><p>טשטוש מסך<\/p><\/td><td><\/td><td><\/td><\/tr><\/table>"}], "imgs": [], "video": true, "title": "סרטון – (1:00) עקרונות ה-GMP"}, {"n": 7, "ch": 1, "blocks": [{"t": "text", "h": "<p><b> GMP - <\/b>Good Manufacturing Practice<\/p>"}, {"t": "text", "h": "<p>תנאים בסיסיים הנדרשים לייצור מזון בטוח ואיכותי, המלווים אותנו בכל שלב בתהליך כדי שנעבוד בצורה עקבית ואחידה,<\/p>"}], "imgs": [], "chips": [{"l": "היגיינה", "to": 8, "st": "cur"}, {"l": "לבוש", "to": 18, "st": ""}, {"l": "ניקיון וחיטוי", "to": 26, "st": ""}, {"l": "סביבת עבודה", "to": 28, "st": ""}, {"l": "הדברה", "to": 30, "st": ""}], "title": "עקרונות GMP"}, {"n": 8, "ch": 1, "blocks": [{"t": "text", "h": "<p><b>היגיינה עובדים<\/b><\/p><p><b>למה זה כל כך חשוב?<\/b><\/p><p>הגורם המרכזי לזיהום מזון הוא מגע של אדם עם ידיים מזוהמות בחיידקים.<\/p><p>חיידקים נמצאים בכל מקום, חלקם אינם מזיקים, אך אחרים עלולים לגרום למחלות ולפגוע בבטיחות המוצר.<\/p><p>הם יכולים לעבור מהעור, מהאף, מהשיער או מהפה, ולהגיע ישירות למזון במהלך העבודה.<\/p><p>לכן, שמירה על היגיינה אישית ושטיפת ידיים יסודית הן חלק בלתי נפרד מהתנהלות נכונה.<\/p>"}], "imgs": [{"k": "6fa73a3be7", "w": 69}], "title": "היגיינה עובדים"}, {"n": 9, "ch": 1, "blocks": [{"t": "text", "h": "<p><b>היגיינה עובדים<\/b><\/p><p><b>הכינו את העובד לכניסה לייצור.<\/b><\/p><p>לחצו על האזורים השונים וודאו שהעובד עומד בכל הדרישות.<\/p>"}], "imgs": [{"k": "482873a1a9", "w": 47}], "title": "היגיינה עובדים – הכינו את העובד לכניסה לייצור", "hot": [{"x": 29.7, "y": 86, "lab": "פלסטר על היד", "t": "פציעות וחתכים", "h": "<p>במידה ובמהלך העבודה נפצעת, או שהגעת עם פציעה / חתך ביד יש לחבוש מיידית את הפציעה בפלסטר הניתן לגילוי בגלאי מתכות  וללבוש מעל כפפה.<\/p><p>חבישה מעבר לפלסטר מחייבת דיווח.<\/p><p>אם החבישה גדולה/ עלולה להשתחרר / מגבילה את העבודה <br>במידת הצורך יועבר העובד זמנית לתפקיד ללא מגע במזון.<\/p>"}, {"x": 48, "y": 17, "lab": "מצב בריאותי", "t": "מצב בריאותי", "h": "<p><b>עובד שמרגיש חולה, עם תסמינים של: חום, שלשולים, הקאות וכו&#x27; אינו רשאי להגיע לעבודה. <\/b><\/p><p>במידה ובמהלך העבודה, הופיעו תסמינים והעובד לא מרגיש טוב. עליו להפסיק את העבודה במיידי, לדווח למנהל שלו על הופעת תסמינים במהלך המשמרת ולצאת מאזורי הייצור. יש לעדכן את האיכות במידת הצורך<\/p><p>מחלות כמו חום, שלשולים או הקאות עלולות להעיד על מחלה זיהומית. עובדים חולים יכולים להעביר מזהמים למזון- דרך הידיים, משטחים או ציוד.<\/p><p>גם מגע לא ישיר עלול לגרום לזיהום צולב של המוצר<\/p><p>לכן עובדים שאינם מרגישים טוב, אינם רשאים להיות במגע עם מזון או להיכנס לאזור ייצור<\/p>"}, {"x": 26.8, "y": 18, "lab": "שלט שירותים", "t": "שירותים", "h": "<p>אין להיכנס לשירותים עם בגדי ייצור: כיסוי ראש וחולצה/ חלוק עליונים.<br><\/p><p>חובה לשטוף ידיים גם ביציאה מהשירותים וגם בחזרה לייצור, במבואת כניסה.<\/p>"}, {"x": 31, "y": 96, "lab": "ציפורניים", "t": "ציפורניים", "h": "<p>יש לשמור על ציפורניים קצרות ונקיות.<br>לק מחייב שימוש בכפפות תקינות.<br>אסורות ציפורניים מלאכותיות וקישוטים.<\/p>"}, {"x": 60.3, "y": 40, "lab": "כוס קפה", "t": "אוכל ושתייה", "h": "<p>חל איסור על אכילה, שתיה ולעיסת מסטיק באזורי הייצור השונים.<\/p><p>אכילה ושתייה מותרים רק באזורים ייעודיים מחוץ לאזורי הייצור וללא חלוק/חולצה וכיסוי ראש.<\/p><p>אין לאחסן מזון בלוקרים.<\/p><p>בייצור מותרת שתיית מים בלבד, בהתאם לנוהל האתר.<br><\/p>"}, {"x": 11, "y": 67.5, "lab": "תיק גב", "t": "אחסון ציוד אישי", "h": "<p>ציוד אישי יאוחסן בלוקר בלבד.<\/p><p>אין לאחסן מזון/ ציוד מפעלי בלוקרים<\/p><p>אין לאחסן מדים נקיים לצד משומשים.<\/p><p>יש לפנות לוקרים לצורך ניקיון תקופתי.<\/p>"}, {"x": 56.2, "y": 76, "lab": "סיגריות בכיס", "t": "עישון", "h": "<p>עישון מותר רק באזורים מסומנים המיועדים לכך וללא בגדי ייצור (חלוק/חולצה/ כיסוי ראש).<\/p><p>יש להשליך בדלים למאפרות.<\/p><p>לפני החזרה לייצור חובה לשטוף ולחטא ידיים<\/p>"}, {"x": 39.2, "y": 74, "lab": "עיתון", "t": "ציוד אישי בייצור", "h": "<p>אין להכניס חפצים אישיים, תרופות, מסטיקים או ציוד שאינו מאושר.<\/p><p>אסורה הכנסת זכוכית מכל סוג.<\/p><p>יש להשתמש רק בציוד המאושר על ידי הארגון.<\/p><p>תרופות מצילות חיים ינוהלו מול מנהל ואיכות.<\/p>"}]}, {"n": 17, "ch": 1, "blocks": [{"t": "text", "h": "<p><b> GMP - <\/b>Good Manufacturing Practice<\/p>"}, {"t": "text", "h": "<p>תנאים בסיסיים הנדרשים לייצור מזון בטוח ואיכותי, המלווים אותנו בכל שלב בתהליך כדי שנעבוד בצורה עקבית ואחידה,<\/p>"}], "imgs": [], "chips": [{"l": "היגיינה", "to": 8, "st": "done"}, {"l": "לבוש", "to": 18, "st": "cur"}, {"l": "ניקיון וחיטוי", "to": 26, "st": ""}, {"l": "סביבת עבודה", "to": 28, "st": ""}, {"l": "הדברה", "to": 30, "st": ""}], "title": "עקרונות GMP – לבוש"}, {"n": 18, "ch": 1, "blocks": [{"t": "text", "h": "<p><b>העובד שלפניכם עומד להיכנס לקו הייצור.<\/b><\/p><p><b>בח  monocytogenes)<\/summary><p><b>מה הסיכון?<\/b><\/p><p>ליסטריה היא חיידק שעלול לגרום למחלת הליסטריוזיס ולהימצא בסביבת הייצור, בקרקע, במים, בבעלי חיים, במפעלי מזון ועל גבי ציוד ומשטחים.<\/p><p>ליסטריה עלולה לשרוד ואף להתפתח בסביבת המפעל, לזהם את המוצר ולסכן את בריאות הצרכן.<\/p><p><b>איך החיידק מגיע למוצר?<\/b><\/p><p>ציוד או משטחים לא נקיים<\/p><p>אזורים רטובים ולחים<\/p><p>היגיינה לא תקינה<\/p><p>מעבר בין אזורים ללא בקרה<\/p><p>זיהום צולב בין אזורים אנשים או ציוד<\/p><p>ניקיון וסניטציה לא מספקים<\/p><p>כשל בטיפול תרמי<\/p><p>כשל בתהליך הניקיון<\/p><\/details><details class=\"acc\"><summary>סלמונלה (Salmonella spp)<\/summary><p><b>מה הסיכון?<\/b><\/p><p>סלמונלה היא חיידק שעלול להימצא בחומרי גלם יבשים, בסביבת העבודה או על גבי ציוד, ולזהם את המוצר במהלך הייצור.<\/p><p>מקורה בהפרשות בעלי חיים, מוצרי בשר, ירקות לא שטופים ,אגוזים ותבלינים יבשים<\/p><p>סלמונלה עלולה לגרום למחלות ולפגוע בבטיחות המוצר ובבריאות הצרכן.<\/p><p><b>איך החיידק מגיע למוצר?<\/b><\/p><p>חומרי גלם מזוהמים<\/p><p>היגיינה אישית לא תקינה<\/p><p>ניקיון וסניטציה לא מספקים<\/p><p>מגע בין חומר גלם למוצר מוכן<\/p><p>זיהום צולב בין אזורים אנשים או ציוד<\/p><\/details><details class=\"acc\"><summary>אי קולי (E. coli)<\/summary><p><b>מה הסיכון?<\/b><\/p><p>E.coli  הוא חיידק שעלול להימצא במזון חי, במים, בסביבת העבודה או על גבי ציוד, ולזהם את המוצר במהלך הייצור.<\/p><p>החיידק עלול לגרום למחלות ולפגיעה בבריאות הצרכן.<\/p><p><b>איך החיידק מגיע למוצר?<\/b><\/p><p>היגיינה אישית לא תקינה<\/p><p>זיהום צולב בין אזורים ציוד או משטחים לא נקיים<\/p><p>מגע עם חומרי גלם מזוהמים<\/p><p>ניקיון וסניטציה לא מספקים<\/p><\/details><details class=\"acc\"><summary>איך נמנעים מחיידקים?<\/summary><p><b>הכרנו 3 סוגים של חיידקים ועכשיו נבין איך ניתן להימנע מהם:<\/b><\/p><p>הקפדה על אחסון נכון של חומרי גלם/ מוצר בתהליך מוצר סופי<\/p><p>הפרדה בין אזורים שונים בייצור והפרדה בין חומרי גלם, מוצרים בתהליך ומוצר סופי<\/p><p>ניקיון וסניטציה מוקפדים<\/p><p>שימוש נכון בחומרי ניקוי וחיטוי ועבודה לפי נהלים<\/p><p>הקפדה בזמן ביצוע הניקיון, לא לנקות בסמוך למוצר חשוף/ קו עובד<\/p><p>עבודה נכונה ושמירה על כלים/ ציוד/ משטחים אשר נוגעים במוצר (ZONE 1)<\/p><p>הקפדה על עבודה בסביבה יבשה ללא מים עומדים וניקוזי ביוב נקיים<\/p><p>עבודה לפי נהלי  GMP ושמירה על כללי הלבוש וביצוע מעבר דרך מבואות סניטריות בין המחלקות השונות<\/p><p>הקפדה על היגיינה אישית ושטיפת ידיים באזורים שונים ולאחר נגיעה באזורים שונים<\/p><p>שימוש בכפפות במקומות המוגדרים, החלפה של כפפות בהתאם לנהלים<\/p><p>עבודה לפי נהלים בכל תהליכי העבודה הקריטיים כמו תהליכי הטיפול התרמי (פסטור, בישול וכו&#x27;)  ודיווח בעת אירוע חריג<\/p><p>בקרה על ציוד, משטחים תהליכי עבודה ותנאי הסביבה<\/p><p>תחזוקה תקינה של ציוד<\/p><p><b>איך אנחנו מונעים?<\/b><\/p><p>הקפדה על היגיינה אישית ושטיפת ידיים<\/p><p>הפרדה בין אזורים וחומרי גלם<\/p><p>ניקיון וסניטציה שוטפים<\/p><p>עבודה לפי נהלי GMP<\/p><p>בקרה על ציוד, משטחים ותהליכי עבודה<\/p><\/details>"}, {"x": 67.5, "y": 85, "lab": "בקבוק חומר ניקוי", "t": "סיכון כימי", "h": "<p>סיכון כימי הוא חדירה של חומרים כימיים למוצר, כמו חומרי ניקוי, חומרי חיטוי או שמנים העלולים  לגרום לזיהום המוצר ולפגיעה בצרכן.<\/p><p><b>איך מונעים אותו?<\/b><\/p><p>ביצוע ניקיונות בהתאם להוראות עבודה ושימוש בריכוזים הנכונים ובשלבי העבודה<\/p><p>אחסון, סימון הפרדה של כל החומרים בהתאם לנהלים<\/p><p>שימוש בחומרים אשר סופקו ע&quot;י הארגון בלבד<\/p><p>תיעוד אחזקה מונעת, גירוזים, הוספת חומרים למערכות והתרעה בעת חריג<\/p><p>ביצוע קלירנס אחזקה בהתאם לנהלים<\/p><p>חומרים מאושרים לשימוש במזון בלבד<\/p><p>.<\/p>"}, {"x": 56, "y": 59, "lab": "חטיף טחינה", "t": "סיכון תזונתי / אלרגני", "h": "<p><b>הסיכון מתחלק ל2 סוגים :<\/b><\/p><p><b>תזונתי : <\/b>נוכחות, היעדרות או חריגה ברמות רכיבים תזונתיים במזון (כגון ויטמינים, מינרלים או רכיבים פונקציונליים), העלולה לגרום להשפעה בריאותית בלתי רצויה לצרכן, בהתאם לאופן השימוש המיועד במוצר.<\/p><p><b>אלרגני: <\/b>נוכחות בלתי מבוקרת או לא מוצהרת של אלרגן במזון, העלולה לגרום לתגובה אלרגית אצל צרכנים בעלי אלרגיה , עד כדי פגיעה בריאותית חמורה או סכנת חיים.<\/p><p>רשימת האלרגנים:<\/p><p>חלב, ביצים, בוטנים, אגוזים (לוז, פיסטוק, פקאן, מלך, מקדמיה), שקדים, סויה, גלוטן, שומשום, דגים, פירות ים, חרדל,  SO2 וסולפיטים.<\/p><p><b>איך מונעים?<\/b><\/p><p>הקפדה על עבודה לפי נהלי וכללי : GMPלבוש והיגיינה :שמירה על כללי הלבוש וביצוע מעבר דרך מבואות סניטריות בין המחלקות השונות<\/p><p>הקפדה על שימוש בציוד ייעודי<\/p><p>הפרדה וסימון בין חומרים, חו&quot;ג/ אריזות וכו&#x27;<\/p><p>ביצוע ניקיונות בין מוצרים עם אלרגנים /ללא אלרגנים<\/p><p>ביצוע בדיקות אימות לנוכחות אלרגנים לאחר ניקיון במעבר בין מוצרים<\/p><p>עבודה בהתאם לנהלים לפי מתכונים<\/p><p>שימוש באריזות הנכונות<\/p>"}]}, {"n": 44, "ch": 3, "blocks": [{"t": "text", "h": "<p>אנחנו עומדים להתחיל את המשמרת<\/p><p>במהלך הלומדה ניכנס לעולם הייצור מנקודת מבט חדשה, כזו שמסתכלת לא רק על העבודה עצמה,<\/p><p>אלא גם על האחריות, תשומת הלב והפעולות הקטנות שעושות את ההבדל בין עבודה שגרתית לבין אירוע בטיחות מזון<\/p><p>לחצו על הכותרות להרחבה<\/p>"}], "imgs": [], "chips": [{"l": "עקרונות GMP", "to": 6, "st": "done"}, {"l": "גורמי סיכון", "to": 32, "st": "done"}, {"l": "תפקידים", "to": 45, "st": "cur"}], "title": "מפת הלומדה – תפקידים"}, {"n": 45, "ch": 3, "blocks": [{"t": "text", "h": "<p><b>תפקידים במפעל<\/b><\/p><p>בטיחות ואיכות המזון נשמרות בכל שלב בתהליך, מהייצור, דרך האחזקה והאריזה, ועד המחסן והמשרדים.<\/p><p>לחצו על כל תפקיד במפעל וגלו כיצד הוא תורם לשמירה על מוצר בטוח ואיכותי.<\/p>"}, {"t": "text", "h": "<p><b>אחריות תפעולית – ייצור<\/b><\/p><p>עובדי הייצור נמצאים במגע ישיר עם המוצר לאורך כל תהליך העבודה, ולכן לכל פעולה יש השפעה על בטיחות ואיכות המזון.<\/p><p>במהלך העבודה יש להקפיד על:<\/p><p>עבודה לפי נהלים והוראות עבודה<\/p><p>שמירה על היגיינה אישית וציוד מגן תקין<\/p><p>דיווח מיידי על תקלות, חריגות או חשש לזיהום<\/p><p>שימוש נכון בחומרי גלם ובציוד העבודה<\/p><p>מניעת ערבוב בין מוצרים, חומרי גלם או אלרגנים<\/p><p>שמירה על סדר, ניקיון וסביבת עבודה נקייה<\/p><p><b>כל חריגה קטנה בתהליך הייצור עלולה להשפיע על בטיחות המוצר, ולכן האחריות נמצאת בידיים של כולנו, בכל רגע ובכל שלב בתהליך.<\/b><\/p>"}], "imgs": [{"k": "a341c6ef06", "w": 27}], "chips": [{"l": "תפקיד ייצור", "to": 45, const S=DATA.slides, CH=DATA.chapters, N=S.length;
let cur=0; const visited=new Set(); const qstate={};
const $=id=>document.getElementById(id);
const chapterOf=i=>S[i].ch;
function chapterDone(c){return S.every((s,i)=>s.ch!==c||visited.has(i));}
function go(i){
  if(i==='END'){showEnd();return}
  if(typeof i==='number' && i>=0 && i<N){cur=i;render();}
}
function renderTabs(){
  $('tabs').innerHTML='';
  CH.forEach((c,k)=>{const b=document.createElement('button');b.className='tab'+(k===chapterOf(cur)?' on':'')+(chapterDone(k)?' done':'');b.textContent=c.name;b.onclick=()=>go(S.findIndex(s=>s.ch===k));$('tabs').appendChild(b);});
}
function renderToc(){
  const t=$('toc');t.innerHTML='';
  CH.forEach((c,k)=>{
    const d=document.createElement('details'); if(k===chapterOf(cur)) d.open=true;
    const s=document.createElement('summary'); s.textContent=c.name+(chapterDone(k)?' ✓':''); d.appendChild(s);
    S.forEach((sl,i)=>{ if(sl.ch!==k) return;
      const a=document.createElement('a'); a.href='#'; a.className=i===cur?'on':'';
      a.innerHTML=`<span>${i+1}.</span><span>${esc(sl.title||'שקף '+(i+1))}</span>${visited.has(i)?'<span class="v">✓</span>':''}`;
      a.onclick=e=>{e.preventDefault();document.body.classList.remove('open');go(i)}; d.appendChild(a);});
    t.appendChild(d);});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const idxOf=n=>S.findIndex(s=>s.n===n);
function chipState(c){
  if(typeof c.to==='number'){ const j=idxOf(c.to); if(j===cur) return 'here'; if(visited.has(j)) return 'done'; }
  return c.st||'';
}
function chipRow(list,big){
  const row=el('div','chips'+(big?' big':''));
  list.forEach(c=>{const b=el('button','chip '+chipState(c),esc(c.l));b.onclick=()=>go(c.to==='END'?'END':idxOf(c.to));row.appendChild(b)});
  return row;
}
function render(){
  visited.add(cur);
  const sl=S[cur]; const m=$('main'); m.innerHTML=''; m.scrollTop=0;
  const card=el('section','slide');
  if(sl.n===1){ card.classList.add('hero');
    const tx=sl.blocks.map(b=>b.h).join('');
    card.innerHTML=`<h1>לומדת איכות</h1><div class="lead">המשמרת מתחילה</div>`;
    card.appendChild(chipRow(sl.chips,true)); m.appendChild(card); finish(); return; }
  card.appendChild(el('div','crumb',esc(CH[sl.ch].name)));
  card.appendChild(el('h2','title',esc(sl.title||'')));
  if(sl.q){ renderQuiz(card,sl); m.appendChild(card); finish(); return; }
  const hasImg=sl.imgs.length>0;
  const cols=el('div','cols'+(hasImg?'':' noimg')); const main=el('div'); const pics=el('div','pics');
  let first=true, infoBlocks=[];
  sl.blocks.forEach(b=>{
    if(b.t==='table'){
      const v=el('button','video','<div class="play">▶</div><div>סרטון (1:00) – לחצו להצגת/הסתרת התסריט</div>');
      const sc=el('div','script',b.h); v.onclick=()=>{sc.hidden=!sc.hidden};
      main.appendChild(v); main.appendChild(sc); return; }
    if(b.t==='info'){ const d=el('div','info',b.h); d.hidden=true; infoBlocks.push(d); return; }
    if(b.t==='check'){ main.appendChild(checklist(b.h)); return; }
    if(b.t==='reveal'){ const r=el('div','reveal',b.h); r.hidden=true;
      const btn=el('button','btn','בדיקה'); btn.onclick=()=>{r.hidden=false;btn.disabled=true};
      main.appendChild(btn); main.appendChild(r); return; }
    let h=b.h;
    if(first && sl.title && h.replace(/<[^>]+>/g,'').trim().startsWith(sl.title.split(' – ')[0].trim()) && h.indexOf('</p>')>0){
      // drop duplicated heading line
      const firstP=h.slice(0,h.indexOf('</p>')+4); if(firstP.replace(/<[^>]+>/g,'').trim().length<70) h=h.slice(firstP.length);
    }
    first=false; if(h.trim()) main.appendChild(el('div','txt',h));
  });
  if(infoBlocks.length){
    const row=el('div','info-row');
    infoBlocks.forEach(d=>{const b=el('button','ibtn','i');b.title='מידע נוסף';b.onclick=()=>{d.hidden=!d.hidden;b.classList.toggle('on')};row.appendChild(b)});
    main.appendChild(el('p','sub','לחצו על ה-i לקבלת מידע נוסף')); main.appendChild(row); infoBlocks.forEach(d=>main.appendChild(d));
  }
  if(sl.chips){ const hub=sl.chips.length===3&&sl.chips.some(c=>c.l==='עקרונות GMP');
    main.appendChild(chipRow(sl.chips,hub)); }
  if(sl.hyg){ main.appendChild(el('p','sub','נושאי היגיינת עובדים – לחצו לבחירה:')); main.appendChild(chipRow(sl.hyg)); }
  if(sl.hot){ renderHot(card,sl,main); m.appendChild(card); finish(); return; }
  sl.imgs.forEach(im=>{const i=document.createElement('img');i.src=IMG[im.k];i.alt='';pics.appendChild(i)});
  cols.appendChild(main); if(hasImg) cols.appendChild(pics); card.appendChild(cols);
  m.appendChild(card); finish();
}
const opened={};
function renderHot(card,sl,main){
  const st=opened[sl.n]||(opened[sl.n]=new Set());
  card.appendChild(main);
  const prog=el('p','hot-prog'); card.appendChild(prog);
  const fig=el('div','hotfig'); const im=document.createElement('img'); im.src=IMG[sl.imgs[0].k]; im.alt=sl.title; fig.appendChild(im);
  sl.hot.forEach((h,k)=>{
    const b=el('button','hot'+(st.has(k)?' seen':''),'<span>'+(st.has(k)?'✓':'')+'</span>');
    b.style.left=h.x+'%'; b.style.top=h.y+'%'; b.title=h.lab; b.setAttribute('aria-label',h.lab+' – '+h.t);
    b.appendChild(el('em','tip',esc(h.lab)));
    b.onclick=()=>{ st.add(k); openPop(h.t,h.h,()=>renderHotUpdate()); };
    fig.appendChild(b);});
  card.appendChild(fig);
  function renderHotUpdate(){ fig.querySelectorAll('.hot').forEach((b,k)=>{ if(st.has(k)){b.classList.add('seen');b.firstChild.textContent='✓';} });
    prog.innerHTML=st.size===sl.hot.length?'<b>✓ מעולה! מצאתם את כל '+sl.hot.length+' הפריטים.</b> אפשר להמשיך.':`נבדקו ${st.size} מתוך ${sl.hot.length} – לחצו על הנקודות באיור`; }
  renderHotUpdate();
}
function openPop(title,html,onClose){
  const p=$('pop'); p.querySelector('h3').textContent=title; p.querySelector('.pbody').innerHTML=html; p.classList.add('show');
  p.querySelector('.pclose').focus();
  p._close=()=>{p.classList.remove('show'); onClose&&onClose();};
}
function checklist(h){
  const wrap=el('div','check'); const tmp=el('div',null,h);
  tmp.querySelectorAll('p').forEach(p=>{
    p.innerHTML.split(/<br>/).forEach(part=>{
      const t=part.replace(/<[^>]+>/g,'').trim(); if(!t) return;
      if(!/[.]$/.test(t) && t.length<30){ wrap.appendChild(el('h4',null,esc(t))); return; }
      const l=el('label',null,`<input type="checkbox"><span>${esc(t)}</span>`); wrap.appendChild(l);
    });
  });
  return wrap;
}
function renderQuiz(card,sl){
  const q=sl.q, st=qstate[sl.n]||(qstate[sl.n]={sel:[],done:false,ok:false});
  if(q.hint) card.appendChild(el('p','q-hint',esc(q.hint)));
  const box=el('div'); card.appendChild(box);
  const act=el('div','qactions'); const check=el('button','btn','בדיקה'); const again=el('button','btn ghost','נסו שוב');
  const fbBox=el('div');
  function paint(){
    box.innerHTML='';
    if(q.type==='single'||q.type==='multi'){
      const o=el('div','opts'+(q.type==='multi'?' multi':''));
      q.opts.forEach((op,k)=>{const b=el('button','opt',`<span class="box"></span><span>${esc(op[0])}</span>`);
        if(st.sel.includes(k)) b.classList.add('sel');
        if(st.done){ if(op[1]&&st.sel.includes(k)) b.classList.add('right'); else if(!op[1]&&st.sel.includes(k)) b.classList.add('wrong'); else if(op[1]) b.classList.add('missed'); }
        b.onclick=()=>{ if(st.done) return; if(q.type==='single') st.sel=[k]; else st.sel=st.sel.includes(k)?st.sel.filter(x=>x!==k):[...st.sel,k]; paint(); };
        o.appendChild(b);});
      box.appendChild(o);
      if(q.type==='multi') box.prepend(el('p','sub','ניתן לבחור יותר מתשובה אחת'));
    } else if(q.type==='match'){
      if(!st.sel.length) st.sel=q.items.map(()=> '');
      q.items.forEach((it,k)=>{const r=el('div','match-row',`<span>${esc(it[0])}</span>`);
        const s=document.createElement('select'); s.innerHTML='<option value="">בחרו סוג סיכון…</option>'+q.cats.map(c=>`<option ${st.sel[k]===c?'selected':''}>${esc(c)}</option>`).join('');
        s.disabled=st.done; s.onchange=()=>{st.sel[k]=s.value;paint()};
        if(st.done) r.classList.add(st.sel[k]===it[1]?'right':'wrong');
        r.appendChild(s); box.appendChild(r);});
    } else if(q.type==='order'){
      if(!st.shuffled){ st.shuffled=[2,0,1]; }
      box.appendChild(el('p','sub','לחצו על הפעולות לפי הסדר הנכון (1, 2, 3)'));
      const o=el('div','opts order');
      st.shuffled.forEach(k=>{const pos=st.sel.indexOf(k);
        const b=el('button','opt'+(pos>=0?' sel':''),`<span class="num">${pos>=0?pos+1:''}</span><span>${esc(q.items[k])}</span>`);
        if(st.done) b.classList.add(st.sel.indexOf(k)===k?'right':'wrong');
        b.onclick=()=>{ if(st.done) return; st.sel=pos>=0?st.sel.filter(x=>x!==k):[...st.sel,k]; paint(); };
        o.appendChild(b);});
      box.appendChild(o);
    }
    const ready= q.type==='match'? st.sel.length && st.sel.every(x=>x) : q.type==='order'? st.sel.length===q.items.length : st.sel.length>0;
    check.disabled=st.done||!ready; again.hidden=!st.done||st.ok;
    fbBox.innerHTML=''; if(st.done){ fbBox.appendChild(el('div','fb '+(st.ok?'ok':'bad'),`<b>${st.ok?'✓ תשובה נכונה':'✗ תשובה שגויה'}</b>${esc(st.ok?q.ok:q.bad)}`)); }
    finishTabs();
  }
  check.onclick=()=>{
    if(q.type==='single'||q.type==='multi'){ const right=q.opts.map((o,k)=>o[1]?k:-1).filter(k=>k>=0); st.ok=right.length===st.sel.length&&right.every(k=>st.sel.includes(k)); }
    else if(q.type==='match') st.ok=q.items.every((it,k)=>st.sel[k]===it[1]);
    else st.ok=st.sel.every((k,pos)=>k===pos);
    st.done=true; if(st.first===undefined) st.first=st.ok; paint();
  };
  again.onclick=()=>{st.done=false;st.sel=[];paint()};
  act.appendChild(check); act.appendChild(again); card.appendChild(act); card.appendChild(fbBox);
  paint();
}
function finishTabs(){renderTabs()}
function finish(){
  renderTabs(); renderToc();
  $('prev').disabled=cur===0;
  $('next').textContent=cur===N-1?'סיום ←':'הבא ←';
  $('count').textContent=`שקף ${cur+1} מתוך ${N}`;
  $('bar').style.width=((cur+1)/N*100)+'%';
}
function showEnd(){
  const qs=S.filter(s=>s.q); const answered=qs.filter(s=>qstate[s.n]&&qstate[s.n].done);
  const right=qs.filter(s=>qstate[s.n]&&qstate[s.n].first);
  $('score').textContent=answered.length?`ענית נכון בניסיון הראשון על ${right.length} מתוך ${qs.length} שאלות התרגול.`:'';
  $('end').classList.add('show');
}
$('prev').onclick=()=>go(cur-1);
$('next').onclick=()=>cur===N-1?showEnd():go(cur+1);
$('menuBtn').onclick=()=>document.body.classList.add('open');
$('closeBtn').onclick=$('scrim').onclick=()=>document.body.classList.remove('open');
$('pop').onclick=e=>{const p=$('pop'); if(e.target===p||e.target.closest('.pclose')||e.target.closest('.pok')) p._close();};
$('restart').onclick=()=>{$('end').classList.remove('show');go(0)};
$('closeEnd').onclick=()=>$('end').classList.remove('show');
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.key==='ArrowLeft'){ cur===N-1?showEnd():go(cur+1); }
  if(e.key==='ArrowRight') go(cur-1);
  if(e.key==='Escape'&&$('pop').classList.contains('show')){$('pop')._close();return}
  if($('pop').classList.contains('show')) return;
  if(e.key==='Escape'){document.body.classList.remove('open');$('end').classList.remove('show')}
});
const hh=parseInt((location.hash||'').slice(1));if(hh>0){const j=S.findIndex(s=>s.n===hh);if(j>=0)cur=j;}
render();
</script>
